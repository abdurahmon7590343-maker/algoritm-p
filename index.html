<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Daftardagi Flowgorithm — V Bob</title>
    <script src="[https://telegram.org/js/telegram-web-app.js](https://telegram.org/js/telegram-web-app.js)"></script>
    <script src="[https://cdn.jsdelivr.net/npm/roughjs@4.6.6/bundled/rough.js](https://cdn.jsdelivr.net/npm/roughjs@4.6.6/bundled/rough.js)"></script>
    <link href="[https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=JetBrains+Mono:wght@400;600&display=swap](https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=JetBrains+Mono:wght@400;600&display=swap)" rel="stylesheet">
    <style>
        :root {
            --ink-blue: #1a3b8b;
            --ink-red: #c92a2a;
            --ink-green: #2b8a3e;
            --grid-line: #d0e3f0;
            --paper-bg: #fdfdf8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        .toolbar {
            background: #0f172a;
            padding: 8px 10px;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            align-items: center;
            border-bottom: 1px solid #334155;
        }
        select, button, input {
            background: #1e293b;
            color: #fff;
            border: 1px solid #475569;
            padding: 6px 9px;
            border-radius: 6px;
            font-size: 12px;
        }
        button { cursor: pointer; font-weight: 600; }
        button.primary { background: #2563eb; border-color: #3b82f6; }
        button.success { background: #16a34a; border-color: #22c55e; }
        button.warning { background: #d97706; border-color: #f59e0b; }
        button.ai-btn { background: #7c3aed; border-color: #8b5cf6; }

        .problem-box {
            background: #1e293b;
            padding: 7px 12px;
            font-size: 12.5px;
            color: #cbd5e1;
            border-bottom: 1px solid #334155;
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .problem-box input {
            flex: 1;
            background: #0f172a;
        }

        .notebook-wrapper {
            flex: 1;
            overflow: auto;
            background-color: var(--paper-bg);
            background-image: 
                linear-gradient(90deg, transparent 39px, #f08080 39px, #f08080 41px, transparent 41px),
                linear-gradient(var(--grid-line) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
            background-size: 100% 100%, 20px 20px, 20px 20px;
            background-attachment: local;
        }
        canvas { display: block; margin: 0 auto; }

        .debug-panel {
            background: #0f172a;
            border-top: 2px solid #334155;
            height: 135px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            font-family: 'JetBrains Mono', monospace;
            font-size: 11.5px;
        }
        .debug-col { padding: 6px 10px; overflow-y: auto; border-right: 1px solid #334155; }
        .debug-title { font-size: 10.5px; color: #94a3b8; margin-bottom: 4px; font-weight: bold; display: flex; justify-content: space-between; }
        .var-table { width: 100%; border-collapse: collapse; }
        .var-table td { padding: 2px 4px; border-bottom: 1px solid #1e293b; }
        .var-name { color: #38bdf8; }
        .var-val { color: #fde047; text-align: right; }
        .console-out { color: #4ade80; white-space: pre-wrap; }
    </style>
</head>
<body>

<div class="toolbar">
    <select id="sectionSelect" onchange="onSectionChange()">
        <option value="5.1">§-5.1. Butun sonlar (1-32)</option>
        <option value="5.2">§-5.2. Sanoq sistemasi (1-32)</option>
        <option value="5.3">§-5.3. Geometriya (1-30)</option>
        <option value="5.4">§-5.4. Tartiblash (1-26)</option>
        <option value="5.5">§-5.5. Ko'phadlar (1-16)</option>
        <option value="5.6">§-5.6. Matritsalar (1-29)</option>
        <option value="5.7">§-5.7. Matritsa algebrasi (1-21)</option>
    </select>

    <select id="problemSelect" onchange="fetchFlowchart()"></select>

    <button class="ai-btn" onclick="fetchFlowchart()">✨ Chizish</button>
    <button class="success" onclick="runSimulation()">▶️ Run</button>
    <button class="primary" onclick="downloadNotebookPNG()">📥 PNG</button>
    <button class="warning" onclick="downloadFPRG()">⚙️ .fprg</button>
</div>

<div class="problem-box">
    <span id="statusBadge">📘</span>
    <input type="text" id="customPrompt" placeholder="Masala sharti (yoki o'zingiz xohlagan masala shartini yozib '✨ Chizish'ni bosing)...">
</div>

<div class="notebook-wrapper">
    <canvas id="flowCanvas" width="920" height="1100"></canvas>
</div>

<div class="debug-panel">
    <div class="debug-col">
        <div class="debug-title">
            <span>🔍 O'zgaruvchilar (Watch)</span>
            <span id="stepCounter">Qadam: 0</span>
        </div>
        <table class="var-table" id="varTable"></table>
    </div>
    <div class="debug-col">
        <div class="debug-title">💻 Konsol (Output)</div>
        <div class="console-out" id="consoleOut">Tayyor. "▶️ Run" tugmasini bosing.</div>
    </div>
</div>

<script>
const tg = window.Telegram?.WebApp;
if (tg) tg.expand();

let SECTIONS_META = {};
let currentProblem = null;
let activeNodeId = null;
let simTimer = null;

async function initApp() {
    try {
        const res = await fetch("/api/sections");
        SECTIONS_META = await res.json();
    } catch (e) {
        SECTIONS_META = { "5.1": { count: 32, problems: {} } };
    }
    onSectionChange();
}

function onSectionChange() {
    const sec = document.getElementById("sectionSelect").value;
    const probSelect = document.getElementById("problemSelect");
    probSelect.innerHTML = "";
    const count = SECTIONS_META[sec]?.count || 32;
    const knownProbs = SECTIONS_META[sec]?.problems || {};

    for (let i = 1; i <= count; i++) {
        const opt = document.createElement("option");
        opt.value = String(i);
        const shortDesc = knownProbs[String(i)] ? ` — ${knownProbs[String(i)].slice(0, 38)}...` : "";
        opt.textContent = `${i}-masala${shortDesc}`;
        probSelect.appendChild(opt);
    }
    fetchFlowchart();
}

async function fetchFlowchart() {
    const sec = document.getElementById("sectionSelect").value;
    const num = document.getElementById("problemSelect").value;
    const knownDesc = SECTIONS_META[sec]?.problems?.[num] || "";
    const inputEl = document.getElementById("customPrompt");
    
    if (knownDesc && !inputEl.dataset.edited) {
        inputEl.value = knownDesc;
    }

    document.getElementById("statusBadge").textContent = "⏳";
    document.getElementById("consoleOut").textContent = "Blok-sxema daftarga chizilmoqda...";

    try {
        const res = await fetch("/api/generate", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ section: sec, number: num, custom: inputEl.value })
        });
        const json = await res.json();
        if (json.ok) {
            currentProblem = json.data;
            inputEl.value = currentProblem.desc;
            document.getElementById("statusBadge").textContent = "✅";
            document.getElementById("consoleOut").textContent = "Chizma tayyor! '▶️ Run' tugmasini bosing.";
            activeNodeId = null;
            drawNotebookFlowchart();
        } else {
            document.getElementById("statusBadge").textContent = "❌";
            document.getElementById("consoleOut").textContent = "Xatolik: " + json.error;
        }
    } catch (err) {
        document.getElementById("statusBadge").textContent = "⚠️";
        document.getElementById("consoleOut").textContent = "Server bilan aloqa yo'q: " + err.message;
    }
}

// Qo'lda tahrirlanganda belgilab qo'yish
document.getElementById("customPrompt").addEventListener("input", (e) => {
    e.target.dataset.edited = "true";
});
document.getElementById("problemSelect").addEventListener("change", () => {
    delete document.getElementById("customPrompt").dataset.edited;
});

// ==========================================================
// KATAK DAFTAR CHIZish DVIGATELI (Rough.js)
// ==========================================================
function countNodes(ast) {
    let c = 0;
    for (const n of (ast || [])) {
        c += 1;
        if (n.body) c += countNodes(n.body);
        if (n.thenBody) c += countNodes(n.thenBody);
        if (n.elseBody) c += countNodes(n.elseBody);
    }
    return c;
}

function drawNotebookFlowchart() {
    if (!currentProblem) return;
    const canvas = document.getElementById("flowCanvas");
    const ctx = canvas.getContext("2d");
    const rc = rough.canvas(canvas);

    canvas.height = Math.max(950, countNodes(currentProblem.ast) * 115 + 240);
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.font = "bold 26px 'Caveat', cursive";
    ctx.fillStyle = "#1a3b8b";
    ctx.textAlign = "center";
    ctx.fillText(currentProblem.title, canvas.width / 2, 38);

    const centerX = canvas.width / 2;
    let currentY = 60;

    drawOval(rc, ctx, centerX, currentY, 150, 42, "Boshlash", false);
    drawArrow(rc, centerX, currentY + 42, centerX, currentY + 75);
    currentY += 75;

    currentY = renderSequence(rc, ctx, currentProblem.ast, centerX, currentY);

    drawOval(rc, ctx, centerX, currentY, 150, 42, "Tamom", false);
}

function renderSequence(rc, ctx, nodes, x, startY) {
    let y = startY;
    for (const node of (nodes || [])) {
        const isActive = (node.id === activeNodeId);

        if (node.type === "declare" || node.type === "assign") {
            drawRect(rc, ctx, x, y, 230, 46, node.text, isActive, node.type === "declare");
            drawArrow(rc, x, y + 46, x, y + 80);
            y += 80;
        } else if (node.type === "input" || node.type === "output") {
            drawParallelogram(rc, ctx, x, y, 230, 46, node.text, isActive);
            drawArrow(rc, x, y + 46, x, y + 80);
            y += 80;
        } else if (node.type === "for") {
            drawHexagon(rc, ctx, x, y, 240, 50, node.text, isActive);
            drawArrow(rc, x, y + 50, x, y + 84);
            const bodyEndY = renderSequence(rc, ctx, node.body, x, y + 84);

            const leftLoopX = x - 185;
            rc.linearPath([[x, bodyEndY - 18], [leftLoopX, bodyEndY - 18], [leftLoopX, y + 25], [x - 120, y + 25]], { stroke: "#1a3b8b", strokeWidth: 2 });

            const rightExitX = x + 185;
            rc.linearPath([[x + 120, y + 25], [rightExitX, y + 25], [rightExitX, bodyEndY + 10], [x, bodyEndY + 10]], { stroke: "#c92a2a", strokeWidth: 1.8 });

            drawArrow(rc, x, bodyEndY + 10, x, bodyEndY + 40);
            y = bodyEndY + 40;
        } else if (node.type === "while") {
            drawDiamond(rc, ctx, x, y, 230, 68, node.text, isActive);
            drawText(ctx, "Ha", x + 18, y + 82, "#2b8a3e");
            drawArrow(rc, x, y + 68, x, y + 100);

            const bodyEndY = renderSequence(rc, ctx, node.body, x, y + 100);

            const leftLoopX = x - 185;
            rc.linearPath([[x, bodyEndY - 18], [leftLoopX, bodyEndY - 18], [leftLoopX, y + 34], [x - 115, y + 34]], { stroke: "#1a3b8b", strokeWidth: 2 });

            drawText(ctx, "Yo'q", x + 135, y + 26, "#c92a2a");
            const rightExitX = x + 185;
            rc.linearPath([[x + 115, y + 34], [rightExitX, y + 34], [rightExitX, bodyEndY + 12], [x, bodyEndY + 12]], { stroke: "#c92a2a", strokeWidth: 1.8 });

            drawArrow(rc, x, bodyEndY + 12, x, bodyEndY + 42);
            y = bodyEndY + 42;
        } else if (node.type === "if") {
            drawDiamond(rc, ctx, x, y, 230, 68, node.text, isActive);
            const branchY = y + 95;
            const leftX = x - 170;
            const rightX = x + 170;

            drawText(ctx, "Ha", x - 135, y + 26, "#2b8a3e");
            rc.linearPath([[x - 115, y + 34], [leftX, y + 34], [leftX, branchY]], { stroke: "#1a3b8b", strokeWidth: 2 });
            const leftEndY = renderSequence(rc, ctx, node.thenBody, leftX, branchY);

            drawText(ctx, "Yo'q", x + 135, y + 26, "#c92a2a");
            rc.linearPath([[x + 115, y + 34], [rightX, y + 34], [rightX, branchY]], { stroke: "#1a3b8b", strokeWidth: 2 });
            const rightEndY = (node.elseBody && node.elseBody.length > 0)
                ? renderSequence(rc, ctx, node.elseBody, rightX, branchY)
                : branchY + 30;

            const mergeY = Math.max(leftEndY, rightEndY) + 15;
            rc.linearPath([[leftX, leftEndY - 15], [leftX, mergeY], [x, mergeY]], { stroke: "#1a3b8b", strokeWidth: 2 });
            rc.linearPath([[rightX, (node.elseBody && node.elseBody.length > 0) ? rightEndY - 15 : branchY], [rightX, mergeY], [x, mergeY]], { stroke: "#1a3b8b", strokeWidth: 2 });

            drawArrow(rc, x, mergeY, x, mergeY + 35);
            y = mergeY + 35;
        }
    }
    return y;
}

function drawOval(rc, ctx, cx, y, w, h, text, active) {
    rc.ellipse(cx, y + h/2, w, h, { stroke: "#1a3b8b", strokeWidth: 2.2, fill: active ? "#fef08a" : "rgba(255,255,255,0.8)", fillStyle: "solid" });
    drawText(ctx, text, cx, y + h/2 + 6);
}
function drawRect(rc, ctx, cx, y, w, h, text, active, isDeclare) {
    rc.rectangle(cx - w/2, y, w, h, { stroke: "#1a3b8b", strokeWidth: 2, fill: active ? "#fef08a" : "rgba(255,255,255,0.8)", fillStyle: "solid" });
    if (isDeclare) rc.line(cx - w/2 + 12, y, cx - w/2 + 12, y + h, { stroke: "#1a3b8b" });
    drawText(ctx, text, cx, y + h/2 + 6);
}
function drawParallelogram(rc, ctx, cx, y, w, h, text, active) {
    const s = 18;
    rc.polygon([[cx - w/2 + s, y], [cx + w/2 + s, y], [cx + w/2 - s, y + h], [cx - w/2 - s, y + h]], { stroke: "#1a3b8b", strokeWidth: 2, fill: active ? "#fef08a" : "rgba(255,255,255,0.8)", fillStyle: "solid" });
    drawText(ctx, text, cx, y + h/2 + 6);
}
function drawDiamond(rc, ctx, cx, y, w, h, text, active) {
    rc.polygon([[cx, y], [cx + w/2, y + h/2], [cx, y + h], [cx - w/2, y + h/2]], { stroke: "#1a3b8b", strokeWidth: 2, fill: active ? "#fef08a" : "rgba(255,255,255,0.8)", fillStyle: "solid" });
    drawText(ctx, text, cx, y + h/2 + 6);
}
function drawHexagon(rc, ctx, cx, y, w, h, text, active) {
    const c = 24;
    rc.polygon([[cx - w/2 + c, y], [cx + w/2 - c, y], [cx + w/2, y + h/2], [cx + w/2 - c, y + h], [cx - w/2 + c, y + h], [cx - w/2, y + h/2]], { stroke: "#1a3b8b", strokeWidth: 2, fill: active ? "#fef08a" : "rgba(255,255,255,0.8)", fillStyle: "solid" });
    drawText(ctx, text, cx, y + h/2 + 6);
}
function drawArrow(rc, x1, y1, x2, y2) {
    rc.line(x1, y1, x2, y2, { stroke: "#1a3b8b", strokeWidth: 2 });
    rc.linearPath([[x2 - 5, y2 - 8], [x2, y2], [x2 + 5, y2 - 8]], { stroke: "#1a3b8b", strokeWidth: 2 });
}
function drawText(ctx, text, x, y, color = "#1a3b8b") {
    ctx.font = "bold 18px 'Caveat', cursive";
    ctx.fillStyle = color;
    ctx.textAlign = "center";
    ctx.fillText(String(text).slice(0, 34), x, y);
}

// ==========================================================
// SIMULYATOR VA EKSPORT FUNKSIYALARI
// ==========================================================
function runSimulation() {
    if (!currentProblem) return;
    if (simTimer) clearInterval(simTimer);
    const trace = [];
    const env = { ...(currentProblem.defaultInput || { n: 10 }) };
    const outputs = [];

    function evalInEnv(expr) {
        try {
            const keys = Object.keys(env);
            const vals = Object.values(env);
            return new Function(...keys, `return ${expr};`)(...vals);
        } catch { return 0; }
    }

    function executeNodes(nodes) {
        for (const node of (nodes || [])) {
            if (trace.length > 120) break;
            trace.push({ id: node.id, env: { ...env }, out: [...outputs] });
            if (node.type === "assign" && node.var) {
                env[node.var] = evalInEnv(node.expr);
            } else if (node.type === "output") {
                outputs.push(evalInEnv(node.expr));
            } else if (node.type === "for") {
                const s = typeof node.from === "number" ? node.from : evalInEnv(node.from);
                const e = typeof node.to === "number" ? node.to : evalInEnv(node.to);
                for (let v = s; v <= e && trace.length <= 120; v++) {
                    env[node.var] = v;
                    trace.push({ id: node.id, env: { ...env }, out: [...outputs] });
                    executeNodes(node.body);
                }
            } else if (node.type === "while") {
                let g = 0;
                while (evalInEnv(node.cond) && g < 35) { executeNodes(node.body); g++; }
            } else if (node.type === "if") {
                if (evalInEnv(node.cond)) executeNodes(node.thenBody);
                else if (node.elseBody) executeNodes(node.elseBody);
            }
        }
    }

    executeNodes(currentProblem.ast);
    let step = 0;
    simTimer = setInterval(() => {
        if (step >= trace.length) {
            clearInterval(simTimer);
            activeNodeId = null;
            drawNotebookFlowchart();
            return;
        }
        const st = trace[step];
        activeNodeId = st.id;
        drawNotebookFlowchart();
        document.getElementById("stepCounter").textContent = `Qadam: ${step + 1}/${trace.length}`;
        const tb = document.getElementById("varTable");
        tb.innerHTML = "";
        for (const k in st.env) tb.innerHTML += `<tr><td class="var-name">${k}</td><td class="var-val">${st.env[k]}</td></tr>`;
        document.getElementById("consoleOut").textContent = st.out.length ? st.out.join("\n") : "Hisoblanmoqda...";
        step++;
    }, 400);
}

function downloadNotebookPNG() {
    const canvas = document.getElementById("flowCanvas");
    const temp = document.createElement("canvas");
    temp.width = canvas.width; temp.height = canvas.height;
    const tCtx = temp.getContext("2d");
    tCtx.fillStyle = "#fdfdf8"; tCtx.fillRect(0, 0, temp.width, temp.height);
    tCtx.strokeStyle = "#d0e3f0"; tCtx.lineWidth = 1;
    for (let x = 0; x < temp.width; x += 20) { tCtx.beginPath(); tCtx.moveTo(x, 0); tCtx.lineTo(x, temp.height); tCtx.stroke(); }
    for (let y = 0; y < temp.height; y += 20) { tCtx.beginPath(); tCtx.moveTo(0, y); tCtx.lineTo(temp.width, y); tCtx.stroke(); }
    tCtx.strokeStyle = "#f08080"; tCtx.lineWidth = 2;
    tCtx.beginPath(); tCtx.moveTo(40, 0); tCtx.lineTo(40, temp.height); tCtx.stroke();
    tCtx.drawImage(canvas, 0, 0);
    const a = document.createElement("a");
    a.download = `${currentProblem.title}.png`;
    a.href = temp.toDataURL("image/png");
    a.click();
}

function downloadFPRG() {
    if (!currentProblem) return;
    function toXml(nodes) {
        let x = "";
        for (const n of (nodes || [])) {
            if (n.type === "declare") x += `<declare name="n, i, s" type="Integer" array="False" size=""/>\n`;
            else if (n.type === "input") x += `<input variable="${n.var || 'n'}"/>\n`;
            else if (n.type === "assign") x += `<assign variable="${n.var || 's'}" expression="${n.expr || '0'}"/>\n`;
            else if (n.type === "output") x += `<output expression="${n.text.replace('Chiqarish: ', '')}" newline="True"/>\n`;
            else if (n.type === "for") x += `<for variable="${n.var}" start="${n.from}" end="${n.to}" direction="inc" step="1">\n${toXml(n.body)}</for>\n`;
            else if (n.type === "while") x += `<while expression="${n.cond}">\n${toXml(n.body)}</while>\n`;
            else if (n.type === "if") x += `<if expression="${n.cond}"><then>${toXml(n.thenBody)}</then><else>${toXml(n.elseBody)}</else></if>\n`;
        }
        return x;
    }
    const xml = `<?xml version="1.0"?>\n<flowgorithm fileversion="3.0">\n<function name="Main" type="None" variable="">\n<parameters/>\n<body>\n${toXml(currentProblem.ast)}</body>\n</function>\n</flowgorithm>`;
    const a = document.createElement("a");
    a.download = `${currentProblem.title}.fprg`;
    a.href = URL.createObjectURL(new Blob([xml], { type: "application/xml" }));
    a.click();
}

window.onload = initApp;
</script>
</body>
</html>
